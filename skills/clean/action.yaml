version: 1
name: clean
description: Delete all Cursor Bugbot comments on a PR and hide bugbot review summaries by marking them outdated. Use when asked to clean up bugbot comments/reviews on a PR.
prompt: |-
  # Bugbot Clean

  Remove every trace of Cursor Bugbot from a PR: delete its inline review comments and issue comments, and minimize its top-level review summaries as OUTDATED (reviews cannot be deleted via the REST API).

  Bugbot's login is `cursor[bot]`. Always match it exactly with `select(.user.login == "cursor[bot]")` — never a substring or regex match.

  ## Inputs

  Accept a PR reference in any form: full URL, bare number, or `owner/repo#number`. If given only a number, resolve owner/repo from the current directory's git remote:

  ```bash
  gh repo view --json nameWithOwner -q .nameWithOwner
  ```

  Set `OWNER`, `REPO`, and `PR` from the resolved reference before proceeding.

  ## Step 1: Delete inline review comments

  List bugbot's inline (diff-anchored) review comment ids:

  ```bash
  gh api repos/OWNER/REPO/pulls/PR/comments --paginate -q '.[] | select(.user.login == "cursor[bot]") | .id'
  ```

  Delete each one:

  ```bash
  gh api -X DELETE repos/OWNER/REPO/pulls/comments/ID
  ```

  Replies authored by others in those threads survive and become orphaned context. Optionally offer (default: no) to also delete the user's own replies to bugbot threads — comments where `.in_reply_to_id` is set and the author equals the authenticated user:

  ```bash
  gh api user -q .login
  ```

  ## Step 2: Delete issue-level comments

  Same pattern against the issues comment collection:

  ```bash
  gh api repos/OWNER/REPO/issues/PR/comments --paginate -q '.[] | select(.user.login == "cursor[bot]") | .id'
  ```

  Delete each one:

  ```bash
  gh api -X DELETE repos/OWNER/REPO/issues/comments/ID
  ```

  ## Step 3: Hide top-level review summaries

  Reviews cannot be deleted via REST. Minimize each bugbot review as OUTDATED via GraphQL instead.

  Collect node ids:

  ```bash
  gh api repos/OWNER/REPO/pulls/PR/reviews --paginate -q '.[] | select(.user.login == "cursor[bot]") | .node_id'
  ```

  Minimize each:

  ```bash
  gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' -f id=NODE_ID
  ```

  Minimizing requires write access to the repo. Already-minimized reviews return `isMinimized=true` harmlessly.

  ## Step 4: Verify

  Re-list all three collections (Steps 1–3 listing commands) and confirm no bugbot comments remain and all bugbot reviews are minimized. Report a short summary table to the user:

  | Collection | Deleted / Minimized |
  |---|---|
  | Inline review comments | N deleted |
  | Issue comments | N deleted |
  | Review summaries | N minimized |

  ## Safety

  - Never delete comments from other humans — only `cursor[bot]`, plus the user's own bugbot-thread replies if explicitly opted in.
  - If a deletion 404s, the comment was already gone — continue, don't abort.
  - Deletion is irreversible. If more than ~30 comments would be affected, echo the count and ask for confirmation before deleting.
requires:
  tools: [Bash]
