version: 1
name: triage
description: Fetch all unresolved Cursor Bugbot comments on a PR, investigate each finding's validity against the code, and propose a resolution (or rebuttal) with a confidence score. The user approves, challenges, or skips each proposal before anything is executed.
prompt: |-
  # Bugbot Triage

  Turn a PR's unresolved bugbot findings into vetted resolutions, one proposal at a time. Nothing is fixed, replied to, or dismissed without the user's explicit approval.

  ## Step 1: Fetch unresolved findings

  Use the bugbot `fetch_unresolved_comments` tool with the PR number (and `owner/repo` if not the current directory's remote). It returns each open finding with parsed `title`, `severity`, `description`, `path`/`line`, `reviewedCommit`, and existing `replies`.

  If the tool is unavailable, fall back to `gh api graphql` over `pullRequest.reviewThreads`, keeping threads where `isResolved` is false and the first comment's author login is `cursor` (GraphQL drops the `[bot]` suffix).

  If the count is zero, report that and stop.

  ## Step 2: Investigate each finding

  For every finding, before forming any opinion:

  1. Read the cited file at the PR head — not just the quoted lines; read enough surrounding code to understand the actual control flow.
  2. Trace the claim concretely: does the described failure path exist? Can the preconditions occur? Is there a guard, caller contract, or server-side invariant the bot missed?
  3. Check staleness: compare `reviewedCommit` against the PR head (`head` in the tool output). If the code changed since bugbot reviewed, verify whether the finding still applies at tip.
  4. Check the `replies` — a finding may already have a standing rationale that just needs a resolution or a follow-up.

  Classify with a verdict:

  - **real** — the bug exists; propose a fix
  - **stale** — reviewed an older commit; already fixed or code removed at tip
  - **by-design** — behavior is intentional; propose a reply explaining the invariant that makes it safe
  - **wontfix** — technically real but explicitly out of scope (e.g. legacy path, accepted tradeoff); propose a reply saying so

  Assign a confidence score 0–100 for the verdict, grounded in evidence:

  - 90+ — traced the exact code path; cited evidence is conclusive
  - 70–89 — strong evidence, one assumption unverified (e.g. runtime behavior not reproduced)
  - 40–69 — plausible reading but meaningful uncertainty remains
  - <40 — could not confirm or refute; say so honestly

  ## Step 3: Propose — one finding at a time

  Present each finding individually (never batch), with:

  - **Finding**: title, severity, `path:line`, link
  - **Verdict** and **confidence**
  - **Evidence**: specific `file:line` citations from the investigation
  - **Proposed action**: either a concrete fix sketch (what changes, in which files, expected test impact) or the exact reply text to post on the thread

  Then ask the user to choose (via AskUserQuestion or equivalent):

  - **Approve** — execute the proposed action
  - **Challenge** — the user disputes the verdict or approach; hear the objection, re-investigate with it in mind, and re-propose (a challenge is new evidence, not a veto to route around)
  - **Skip** — leave the finding untouched and move to the next

  ## Step 4: Execute approved actions

  - **Fixes**: implement following the repo's conventions (check AGENTS.md/CLAUDE.md), run the repo's verification commands, and commit per its commit style. Then reply on the thread stating what was fixed and in which commit.
  - **Replies** (stale / by-design / wontfix): post with

  ```bash
  gh api repos/OWNER/REPO/pulls/PR/comments/COMMENT_ID/replies -f body="..."
  ```

  using the finding's `commentId`. Keep replies specific: name the guard, invariant, or commit that settles it — never a bare "this is fine".

  ## Step 5: Summarize

  End with a table: finding → verdict → confidence → action taken (fixed in `<sha>` / replied / skipped / challenged-then-X). Note anything the user should follow up on (e.g. low-confidence skips).
requires:
  tools: [Bash, Read, Grep, Glob, AskUserQuestion]
